apiVersion: apps/v1
kind: Deployment
metadata:
  name: petshop-deployment
  labels:
    env: dev
    owner: ajay

spec:
  replicas: 2

  selector:
    matchLabels:
      env: dev
      owner: ajay

  template:
    metadata:
      labels:
        env: dev
        owner: ajay

    spec:
      containers:
      - name: mycont1
        image: ajaypasili/durga-image:v1
        ports:
        - containerPort: 8080
